name: CI

on:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

env:
  UV_FROZEN: "1"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: make sync

      - name: Lint
        run: make format-check lint

      - name: Type check
        run: make pyright

      - name: Test
        run: make test

      - name: Build docs
        run: uv run --frozen mkdocs build --strict

      - name: Build distributions
        run: make build

      - name: Check wheel installs
        run: |
          wheel="$(realpath dist/*.whl)"
          python_version="$(cat .python-version)"
          uv --no-config run --no-project --isolated --python "$python_version" \
            --default-index https://pypi.org/simple --with "$wheel" \
            python -I -c 'import chatkit.agents, chatkit.server, chatkit.widgets, uvicorn'
          uv --no-config run --no-project --isolated --python "$python_version" \
            --default-index https://pypi.org/simple --with "${wheel}[fastapi]" \
            python -I -c 'from fastapi import FastAPI; import chatkit.server; FastAPI()'
