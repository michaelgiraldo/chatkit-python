name: CI

on:
  pull_request:
  push:
    branches: [codex/python-314-baseline]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: make sync

      - name: Lint
        run: make format-check lint

      - name: Type check
        run: make pyright

      - name: Test
        run: make test

      - name: Build docs
        run: make docs-check

      - name: Build distributions
        run: make build

      - name: Check wheel installs
        run: |
          wheel="$(realpath dist/*.whl)"
          python_version="$(cat .python-version)"
          uv --no-config run --no-project --isolated --python "$python_version" \
            --default-index https://pypi.org/simple --with "$wheel" \
            python -I - <<'PY'
          from importlib.util import find_spec

          import chatkit.server
          import chatkit.widgets

          for dependency in ("agents", "openai", "fastapi", "uvicorn", "jinja2", "chatkit.types"):
              assert find_spec(dependency) is None, dependency
          PY
          uv --no-config run --no-project --isolated --python "$python_version" \
            --default-index https://pypi.org/simple --with "$wheel" \
            python -I tests/check_wheel_types.py .venv/bin/pyright
          uv --no-config run --no-project --isolated --python "$python_version" \
            --default-index https://pypi.org/simple --with "${wheel}[fastapi]" \
            python -I - <<'PY'
          from importlib.util import find_spec

          import uvicorn
          from fastapi import FastAPI

          from chatkit.fastapi import process_request

          assert callable(process_request)
          FastAPI()
          for dependency in ("agents", "openai"):
              assert find_spec(dependency) is None, dependency
          PY
          uv --no-config run --no-project --isolated --python "$python_version" \
            --default-index https://pypi.org/simple --with "${wheel}[agents]" \
            python -I - <<'PY'
          from importlib.util import find_spec

          import agents
          import openai

          from chatkit.agent_input import ThreadItemConverter
          from chatkit.agents import stream_agent_response

          assert callable(stream_agent_response)
          assert callable(ThreadItemConverter().to_agent_input)
          assert find_spec("fastapi") is None
          PY
          uv --no-config run --no-project --isolated --python "$python_version" \
            --default-index https://pypi.org/simple --with "${wheel}[templates]" \
            python -I - <<'PY'
          from importlib.util import find_spec

          from chatkit.templates import WidgetTemplate

          template = WidgetTemplate({
              "version": "1.0", "name": "Example",
              "template": '{"type":"Card","children":[]}',
          })
          assert template.build().type == "Card"
          for dependency in ("agents", "fastapi"):
              assert find_spec(dependency) is None, dependency
          PY
